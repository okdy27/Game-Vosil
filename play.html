<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Vosil Survival</title>
<meta name="theme-color" content="#0b1a24">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; touch-action: none; }
  #g { position: fixed; left: 0; top: 0; border: 0; background: #000; transform-origin: 0 0; }
  #flip { position: fixed; z-index: 5; left: 6px; bottom: 6px; width: 30px; height: 30px; border-radius: 50%; border: 1px solid rgba(160, 215, 245, .5); background: rgba(10, 25, 38, .55); color: #cfe3ee; font-size: 15px; line-height: 28px; padding: 0; display: none; }
</style>
</head>
<body>
<!-- Pembungkus untuk aplikasi yang mengunci layar potret (mis. World App): game dimuat di iframe berukuran landscape lalu diputar 90 derajat.
     Di dalam iframe, ukuran layar, media query, dan koordinat sentuh sudah landscape, jadi survival.html tidak perlu diubah. -->
<iframe id="g" allow="fullscreen; autoplay; clipboard-write" allowfullscreen></iframe>
<button id="flip" type="button" aria-label="Putar arah">↻</button>
<script>
(function () {
  var f = document.getElementById('g'), b = document.getElementById('flip'), dir = 1;
  try { dir = localStorage.getItem('vosil_flip_v1') === '-1' ? -1 : 1; } catch (e) { /* abaikan */ }
  var src = 'survival.html' + (location.search || '') + (location.hash || '');
  function layout() {
    var W = window.innerWidth, H = window.innerHeight, portrait = H > W * 1.05;
    if (portrait) {
      f.style.width = H + 'px'; f.style.height = W + 'px';
      f.style.transform = dir === 1 ? 'translate(' + W + 'px,0) rotate(90deg)' : 'translate(0,' + H + 'px) rotate(-90deg)';
      b.style.display = 'block';
    } else {
      f.style.width = W + 'px'; f.style.height = H + 'px'; f.style.transform = 'none'; b.style.display = 'none';
    }
  }
  b.addEventListener('click', function () { dir = -dir; try { localStorage.setItem('vosil_flip_v1', String(dir)); } catch (e) { /* abaikan */ } layout(); });
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', function () { setTimeout(layout, 120); });
  layout();
  f.src = src;
})();
</script>
<script type="module">
// Jembatan World App: MiniKit hanya hidup di jendela induk ini, bukan di dalam iframe game.
const APP_ID = 'app_82389b471d74ed32154347e1a7ad91d8';
const frame = document.getElementById('g');
let MK = null, installed = false;
const announce = () => { try { frame.contentWindow.postMessage({ vosil: 'world-info', installed }, location.origin); } catch (e) { /* abaikan */ } };
try {
  const m = await import('https://cdn.jsdelivr.net/npm/@worldcoin/minikit-js@2.0.3/+esm');
  MK = m.MiniKit || m.default || null;
  if (MK && typeof MK.install === 'function') { try { MK.install(APP_ID); } catch (e) { /* abaikan */ } }
  installed = !!(MK && (typeof MK.isInstalled === 'function' ? MK.isInstalled() : window.WorldApp));
} catch (e) { installed = false; }
announce();
frame.addEventListener('load', announce);
async function auth(nonce) {
  const params = { nonce, expirationTime: new Date(Date.now() + 10 * 60e3), statement: 'Sign in to Vosil Game. Signature only: no transaction, no fee.' };
  let res;
  if (MK && typeof MK.walletAuth === 'function') res = await MK.walletAuth(params);
  else if (MK && MK.commandsAsync && MK.commandsAsync.walletAuth) res = await MK.commandsAsync.walletAuth(params);
  else throw new Error('no_api');
  const p = (res && (res.data || res.finalPayload)) || res;
  if (!p || p.status === 'error' || !p.signature || !p.message || !p.address) { const e = new Error('fail'); e.code = p && (p.error_code || p.code); throw e; }
  return { address: p.address, message: p.message, signature: p.signature };
}
window.addEventListener('message', async (e) => {
  if (e.source !== frame.contentWindow || e.origin !== location.origin || !e.data) return;
  const d = e.data, reply = (o) => { try { frame.contentWindow.postMessage(Object.assign({ vosil: 'world-auth-result', id: d.id }, o), location.origin); } catch (x) { /* abaikan */ } };
  if (d.vosil === 'world-hello') announce();
  else if (d.vosil === 'world-auth' && typeof d.nonce === 'string' && /^[0-9a-f]{32}$/.test(d.nonce)) {
    try { reply({ ok: true, payload: await auth(d.nonce) }); }
    catch (err) { reply({ ok: false, error: /reject|cancel|denied/i.test(String(err && (err.code || err.message))) ? 'rejected' : 'fail' }); }
  }
});
</script>
</body>
</html>
